<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Frame & Gifts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at 50% 20%, #151a24 0%, #080a0f 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Butterfly Container */
    .butterfly-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      perspective: 1200px;
    }

    .butterfly {
      position: absolute;
      width: 72px;
      height: 56px;
      transform-style: preserve-3d;
      will-change: transform;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }

    .butterfly-body {
      position: absolute;
      left: 34px;
      top: 6px;
      width: 4px;
      height: 44px;
      background: #110d08;
      border-radius: 4px;
      z-index: 4;
    }

    .butterfly-body::before, .butterfly-body::after {
      content: '';
      position: absolute;
      top: -8px;
      width: 1.5px;
      height: 14px;
      background: #2b1d0c;
      border-radius: 1px;
    }
    .butterfly-body::before { left: -3px; transform: rotate(-30deg); }
    .butterfly-body::after { right: -3px; transform: rotate(30deg); }

    .wing-left, .wing-right {
      position: absolute;
      top: 0;
      width: 35px;
      height: 54px;
      border-radius: 65% 35% 55% 45% / 60% 40% 60% 40%;
      box-shadow: inset 0 0 6px rgba(255,255,255,0.45), 0 3px 10px rgba(0,0,0,0.5);
      border: 1px solid rgba(0,0,0,0.5);
    }

    .wing-left {
      left: 0;
      transform-origin: 100% 50%;
      animation: flapLeft 0.17s infinite alternate ease-in-out;
    }

    .wing-right {
      left: 37px;
      border-radius: 35% 65% 45% 55% / 40% 60% 40% 60%;
      transform-origin: 0% 50%;
      animation: flapRight 0.17s infinite alternate ease-in-out;
    }

    @keyframes flapLeft {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(-72deg) rotateZ(12deg); }
    }

    @keyframes flapRight {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(72deg) rotateZ(-12deg); }
    }

    .monarch-orange .wing-left, .monarch-orange .wing-right {
      background: radial-gradient(circle at 45% 40%, #ff7f11 20%, #d35400 60%, #151515 95%);
    }

    .royal-blue .wing-left, .royal-blue .wing-right {
      background: radial-gradient(circle at 45% 40%, #00d2ff 25%, #0052d4 65%, #0a1128 95%);
      filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.7));
    }

    .cream-orange .wing-left, .cream-orange .wing-right {
      background: radial-gradient(circle at 45% 40%, #ffffff 25%, #ff9f43 65%, #1f1f1f 95%);
    }

    .golden-swallow .wing-left, .golden-swallow .wing-right {
      background: radial-gradient(circle at 45% 40%, #fff275 25%, #e5a93b 65%, #3d2600 95%);
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
    }

    .velvet-magenta .wing-left, .velvet-magenta .wing-right {
      background: radial-gradient(circle at 45% 40%, #ff5277 25%, #c2185b 65%, #2a0014 95%);
    }

    .electric-purple .wing-left, .electric-purple .wing-right {
      background: radial-gradient(circle at 45% 40%, #e056fd 25%, #7b1fa2 65%, #180029 95%);
      filter: drop-shadow(0 0 10px rgba(224, 86, 253, 0.7));
    }

    .emerald-forest .wing-left, .emerald-forest .wing-right {
      background: radial-gradient(circle at 45% 40%, #69f0ae 20%, #00b894 65%, #003323 95%);
    }

    .crimson-scarlet .wing-left, .crimson-scarlet .wing-right {
      background: radial-gradient(circle at 45% 40%, #ff5252 25%, #b71540 65%, #1a0006 95%);
    }

    /* Zig-Zag Flight Paths */
    .bf1 { top: 10%; left: 8%; animation: zigZag1 22s infinite ease-in-out; }
    .bf2 { top: 75%; left: 82%; animation: zigZag2 24s infinite ease-in-out -4s; }
    .bf3 { top: 40%; left: 5%; animation: zigZag3 26s infinite ease-in-out -8s; }
    .bf4 { top: 20%; left: 80%; animation: zigZag4 23s infinite ease-in-out -12s; }
    .bf5 { top: 85%; left: 15%; animation: zigZag5 25s infinite ease-in-out -6s; }
    .bf6 { top: 5%; left: 45%; animation: zigZag6 21s infinite ease-in-out -15s; }
    .bf7 { top: 60%; left: 75%; animation: zigZag7 27s infinite ease-in-out -10s; }
    .bf8 { top: 45%; left: 88%; animation: zigZag8 28s infinite ease-in-out -18s; }

    @keyframes zigZag1 {
      0% { transform: translate(0, 0) rotate(15deg); }
      20% { transform: translate(16vw, 18vh) rotate(55deg); }
      40% { transform: translate(32vw, -8vh) rotate(-25deg); }
      60% { transform: translate(55vw, 25vh) rotate(60deg); }
      80% { transform: translate(25vw, 42vh) rotate(145deg); }
      100% { transform: translate(0, 0) rotate(15deg); }
    }

    @keyframes zigZag2 {
      0% { transform: translate(0, 0) rotate(-140deg); }
      20% { transform: translate(-20vw, -25vh) rotate(-90deg); }
      45% { transform: translate(-50vw, -10vh) rotate(-160deg); }
      65% { transform: translate(-30vw, -45vh) rotate(-35deg); }
      85% { transform: translate(-10vw, -20vh) rotate(-120deg); }
      100% { transform: translate(0, 0) rotate(-140deg); }
    }

    @keyframes zigZag3 {
      0% { transform: translate(0, 0) rotate(45deg); }
      25% { transform: translate(28vw, -25vh) rotate(-30deg); }
      50% { transform: translate(60vw, 15vh) rotate(65deg); }
      75% { transform: translate(35vw, 38vh) rotate(140deg); }
      100% { transform: translate(0, 0) rotate(45deg); }
    }

    @keyframes zigZag4 {
      0% { transform: translate(0, 0) rotate(-110deg); }
      25% { transform: translate(-35vw, 30vh) rotate(-165deg); }
      50% { transform: translate(-65vw, 10vh) rotate(-45deg); }
      75% { transform: translate(-25vw, -15vh) rotate(30deg); }
      100% { transform: translate(0, 0) rotate(-110deg); }
    }

    @keyframes zigZag5 {
      0% { transform: translate(0, 0) rotate(-35deg); }
      30% { transform: translate(30vw, -45vh) rotate(-70deg); }
      55% { transform: translate(65vw, -20vh) rotate(35deg); }
      80% { transform: translate(40vw, -65vh) rotate(-85deg); }
      100% { transform: translate(0, 0) rotate(-35deg); }
    }

    @keyframes zigZag6 {
      0% { transform: translate(0, 0) rotate(85deg); }
      25% { transform: translate(-25vw, 40vh) rotate(145deg); }
      50% { transform: translate(30vw, 65vh) rotate(20deg); }
      75% { transform: translate(-10vw, 30vh) rotate(-80deg); }
      100% { transform: translate(0, 0) rotate(85deg); }
    }

    @keyframes zigZag7 {
      0% { transform: translate(0, 0) rotate(-125deg); }
      30% { transform: translate(-45vw, -30vh) rotate(-170deg); }
      60% { transform: translate(-20vw, 25vh) rotate(45deg); }
      85% { transform: translate(-55vw, 15vh) rotate(-140deg); }
      100% { transform: translate(0, 0) rotate(-125deg); }
    }

    @keyframes zigZag8 {
      0% { transform: translate(0, 0) rotate(-95deg); }
      25% { transform: translate(-30vw, -25vh) rotate(-150deg); }
      50% { transform: translate(-60vw, 25vh) rotate(60deg); }
      75% { transform: translate(-25vw, 35vh) rotate(135deg); }
      100% { transform: translate(0, 0) rotate(-95deg); }
    }

    /* Card */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: rgba(18, 22, 31, 0.84);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 28px;
      padding: 38px 26px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 
                  0 0 25px rgba(212, 175, 55, 0.15);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo Box */
    .logo-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      border-radius: 24px;
      padding: 3px;
      background: linear-gradient(135deg, #f7d070, #cf9b33, #7a5410, #f7d070);
      box-shadow: 0 0 30px rgba(218, 165, 32, 0.45);
      overflow: hidden;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 21px;
      object-fit: contain;
      display: block;
      background: #080a0f;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #fff2be 0%, #dfaa37 50%, #996c14 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 13px;
      color: #9ea8b6;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-bottom: 26px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .link-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }

    .arrow-icon {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, rgba(37, 211, 102, 0.18), rgba(18, 140, 126, 0.25));
      border-color: rgba(37, 211, 102, 0.35);
    }
    .btn-whatsapp .icon-box {
      background: linear-gradient(135deg, #25D366, #128C7E);
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
    }

    .btn-website {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.16), rgba(160, 120, 20, 0.22));
      border-color: rgba(212, 175, 55, 0.4);
    }
    .btn-website .icon-box {
      background: linear-gradient(135deg, #f3cd67, #b8860b);
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
    }

    .btn-google {
      background: linear-gradient(135deg, rgba(66, 133, 244, 0.18), rgba(234, 67, 53, 0.18));
      border-color: rgba(234, 67, 53, 0.35);
    }
    .btn-google .icon-box {
      background: linear-gradient(135deg, #EA4335, #4285F4);
      box-shadow: 0 4px 14px rgba(234, 67, 53, 0.35);
    }

    .footer {
      margin-top: 26px;
      font-size: 11px;
      color: #6a7482;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>

</body>
